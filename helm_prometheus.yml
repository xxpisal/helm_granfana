prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
grafana:
  enabled: true
  adminUser: admin
  adminPassword: changeme
  service:
    type: LoadBalancer
    port: 3000
  persistence:
    enabled: true
    size: 10Gi
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
